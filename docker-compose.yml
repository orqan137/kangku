services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kangku
      POSTGRES_USER: kangku
      POSTGRES_PASSWORD: kangku
    ports:
      - "5432:5432"
    volumes:
      - kangku_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kangku
      MINIO_ROOT_PASSWORD: kangku-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kangku_minio:/data

volumes:
  kangku_postgres:
  kangku_minio:
